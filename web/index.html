<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Face Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0a0a0a; 
      color: white; 
      overflow: hidden;
      height: 100dvh;
    }
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #preview3d {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 140px;
      height: 140px;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      border: 1px solid #333;
      display: none;
      z-index: 20;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      padding: 0 12px;
    }
    button {
      background: #2196F3;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(33,150,243,0.4);
      margin: 4px;
    }
    button:active { transform: scale(0.96); }
    button.secondary { background: #424242; }
    button.success { background: #4CAF50; }
    #status {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
      min-height: 20px;
    }
    #guide {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 5;
      padding: 0 20px;
    }
    #angles {
      position: absolute;
      top: 50px;
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      opacity: 0.8;
      z-index: 5;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <canvas id="preview3d"></canvas>
  <div id="guide">صورت را داخل فریم قرار بده</div>
  <div id="angles"></div>

  <div id="ui">
    <button id="startBtn">شروع اسکن</button>
    <button id="smileBtn" class="secondary" style="display:none;">حالت لبخند</button>
    <button id="captureBtn" class="secondary" style="display:none;">گرفتن فریم</button>
    <button id="stlBtn" class="success" style="display:none;">خروجی STL</button>
    <div id="status">آماده برای شروع</div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const preview3d = document.getElementById('preview3d');
    const startBtn = document.getElementById('startBtn');
    const smileBtn = document.getElementById('smileBtn');
    const captureBtn = document.getElementById('captureBtn');
    const stlBtn = document.getElementById('stlBtn');
    const statusEl = document.getElementById('status');
    const guideEl = document.getElementById('guide');
    const anglesEl = document.getElementById('angles');

    let faceLandmarker = null;
    let running = false;
    let lastVideoTime = -1;
    let smileMode = false;
    let capturedFrames = [];
    let currentLandmarks = null;

    // Simplified but proper face mesh triangles (subset of MediaPipe FACEMESH_TESSELATION)
    const FACE_TRIANGLES = [
      [127,34,139],[11,0,37],[232,231,120],[72,37,39],[128,121,47],[232,121,128],
      [104,69,67],[175,171,148],[118,50,101],[73,39,40],[9,151,108],[48,115,131],
      [194,204,211],[74,40,185],[80,42,183],[40,92,186],[230,229,118],[202,212,214],
      [83,18,17],[76,61,146],[160,29,30],[56,157,173],[106,204,194],[135,214,192],
      [203,165,98],[21,71,68],[51,45,4],[144,24,23],[77,146,91],[205,50,187],
      [201,200,18],[91,106,182],[90,91,181],[85,84,17],[206,203,36],[148,171,140],
      [92,40,39],[193,189,244],[159,158,28],[247,246,161],[236,3,196],[54,68,104],
      [193,168,8],[117,228,31],[189,193,55],[98,97,99],[126,47,100],[166,79,218],
      [155,154,26],[209,49,131],[135,136,150],[47,126,217],[223,52,53],[45,51,134],
      [211,170,140],[67,69,108],[43,106,91],[230,119,118],[101,36,100],[57,212,202],
      [20,60,99],[28,158,157],[35,226,130],[226,35,111],[143,35,124],[110,163,7],
      [228,110,25],[356,389,368],[11,302,267],[452,350,349],[302,303,269],[357,343,277],
      [452,453,357],[333,332,297],[175,396,369],[400,377,378],[152,148,176],[377,400,378],
      [394,395,369],[378,379,365],[397,288,361],[323,361,454],[356,389,251],[284,332,297],
      [5,4,1],[275,4,45],[4,5,195],[98,97,2],[326,2,97],[2,326,327],[326,2,164],
      [0,11,12],[12,13,14],[14,15,16],[16,17,18],[18,200,199],[199,175,171]
    ];

    let scene, camera, renderer, mesh;
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
      camera.position.z = 2;
      renderer = new THREE.WebGLRenderer({ canvas: preview3d, alpha: true, antialias: true });
      renderer.setSize(140, 140);
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(1, 1, 1);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));
    }

    function updateMesh(landmarks) {
      if (!landmarks || landmarks.length < 100) return;
      const points = [];
      for (let i = 0; i < Math.min(landmarks.length, 200); i += 2) {
        const lm = landmarks[i];
        points.push(new THREE.Vector3(
          (lm.x - 0.5) * 2,
          -(lm.y - 0.5) * 2,
          (lm.z || 0) * 2
        ));
      }
      if (points.length < 10) return;

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      if (mesh) scene.remove(mesh);
      mesh = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0x00e676, size: 0.02 }));
      scene.add(mesh);
      renderer.render(scene, camera);
      preview3d.style.display = 'block';
    }

    async function initMediaPipe() {
      statusEl.textContent = 'در حال بارگذاری مدل...';
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
      statusEl.textContent = 'مدل آماده است';
      initThree();
    }

    function resize() {
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        running = true;
        startBtn.style.display = 'none';
        smileBtn.style.display = 'inline-block';
        captureBtn.style.display = 'inline-block';
        stlBtn.style.display = 'inline-block';
        statusEl.textContent = 'دوربین فعال شد';
        anglesEl.textContent = 'زوایا: روبه‌رو → چپ → راست → بالا';
        resize();
        window.addEventListener('resize', resize);
        detectLoop();
      } catch (err) {
        statusEl.textContent = 'خطا دوربین: ' + err.message;
      }
    }

    function detectLoop() {
      if (!running || !faceLandmarker) return;

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, overlay.width, overlay.height);

        const cx = overlay.width / 2;
        const cy = overlay.height * 0.42;
        const r = Math.min(overlay.width, overlay.height) * 0.28;
        ctx.strokeStyle = smileMode ? 'rgba(255, 193, 7, 0.7)' : 'rgba(0, 230, 118, 0.6)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          currentLandmarks = landmarks;
          statusEl.textContent = smileMode ? 'لبخند تشخیص داده شد' : 'صورت تشخیص داده شد';
          guideEl.textContent = smileMode ? 'لبخند بزن و ثابت نگه دار' : 'صورت خوب است — ثابت نگه دار';

          ctx.fillStyle = smileMode ? '#ffc107' : '#00e676';
          for (const lm of landmarks) {
            const x = lm.x * overlay.width;
            const y = lm.y * overlay.height;
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
          }

          let minX = 1, minY = 1, maxX = 0, maxY = 0;
          for (const lm of landmarks) {
            minX = Math.min(minX, lm.x);
            minY = Math.min(minY, lm.y);
            maxX = Math.max(maxX, lm.x);
            maxY = Math.max(maxY, lm.y);
          }
          ctx.strokeStyle = '#2196F3';
          ctx.lineWidth = 3;
          ctx.strokeRect(minX * overlay.width, minY * overlay.height, (maxX - minX) * overlay.width, (maxY - minY) * overlay.height);

          updateMesh(landmarks);
        } else {
          statusEl.textContent = 'صورت پیدا نشد';
          guideEl.textContent = 'صورت را داخل دایره قرار بده';
          currentLandmarks = null;
        }
      }
      requestAnimationFrame(detectLoop);
    }

    function captureFrame() {
      if (!currentLandmarks) {
        statusEl.textContent = 'اول صورت را تشخیص بده';
        return;
      }
      capturedFrames.push(currentLandmarks);
      statusEl.textContent = `فریم ${capturedFrames.length} گرفته شد`;
      anglesEl.textContent = `فریم‌های گرفته شده: ${capturedFrames.length}`;
    }

    function exportSTL() {
      if (!currentLandmarks || currentLandmarks.length < 400) {
        statusEl.textContent = 'اول صورت را تشخیص بده';
        return;
      }

      const scale = 100;
      let stl = 'solid face_mesh\n';

      for (const tri of FACE_TRIANGLES) {
        const [i1, i2, i3] = tri;
        if (i1 >= currentLandmarks.length || i2 >= currentLandmarks.length || i3 >= currentLandmarks.length) continue;

        const a = currentLandmarks[i1];
        const b = currentLandmarks[i2];
        const c = currentLandmarks[i3];

        const ax = (a.x - 0.5) * scale;
        const ay = (0.5 - a.y) * scale;
        const az = (a.z || 0) * scale * 0.5;

        const bx = (b.x - 0.5) * scale;
        const by = (0.5 - b.y) * scale;
        const bz = (b.z || 0) * scale * 0.5;

        const cx = (c.x - 0.5) * scale;
        const cy = (0.5 - c.y) * scale;
        const cz = (c.z || 0) * scale * 0.5;

        stl += `  facet normal 0 0 1\n    outer loop\n`;
        stl += `      vertex ${ax.toFixed(3)} ${ay.toFixed(3)} ${az.toFixed(3)}\n`;
        stl += `      vertex ${bx.toFixed(3)} ${by.toFixed(3)} ${bz.toFixed(3)}\n`;
        stl += `      vertex ${cx.toFixed(3)} ${cy.toFixed(3)} ${cz.toFixed(3)}\n`;
        stl += `    endloop\n  endfacet\n`;
      }

      stl += 'endsolid face_mesh\n';

      const blob = new Blob([stl], { type: 'application/sla' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'face-mesh-proper.stl';
      a.click();
      URL.revokeObjectURL(url);
      statusEl.textContent = 'STL منظم دانلود شد';
    }

    smileBtn.addEventListener('click', () => {
      smileMode = !smileMode;
      smileBtn.textContent = smileMode ? 'حالت صورت' : 'حالت لبخند';
      smileBtn.style.background = smileMode ? '#ff9800' : '#424242';
    });

    startBtn.addEventListener('click', async () => {
      if (!faceLandmarker) await initMediaPipe();
      startCamera();
    });

    captureBtn.addEventListener('click', captureFrame);
    stlBtn.addEventListener('click', exportSTL);

    initMediaPipe().catch(err => {
      statusEl.textContent = 'خطا در بارگذاری: ' + err.message;
    });
  </script>
</body>
</html>

    #status {

      font-size: 14px;
      opacity: 0.9;
      min-height: 20px;

    #guide {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 5;
      padding: 0 20px;

    #angles {
      position: absolute;
      top: 50px;
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      opacity: 0.8;
      z-index: 5;
    }

    let scene, camera, renderer, mesh;
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, 1, 0.01, 10);
      renderer = new THREE.WebGLRenderer({ canvas: preview3d, alpha: true, antialias: true });
      renderer.setSize(140, 140);
      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(1, 1, 2);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x666666));
    }

    function facePositions(landmarks, aspect) {
      if (!landmarks || landmarks.length < FACE_VERTEX_COUNT || !Number.isFinite(aspect) || aspect <= 0) return null;

      const positions = new Float32Array(FACE_VERTEX_COUNT * 3);
      const anchor = landmarks[1];
      for (let i = 0; i < FACE_VERTEX_COUNT; i++) {
        const { x, y, z } = landmarks[i];
        if (![x, y, z].every(Number.isFinite)) return null;
        positions.set([x - anchor.x, (anchor.y - y) / aspect, anchor.z - z], i * 3);
      }
      return positions;
    }

    function updateMesh(positions, indices = FACE_INDICES) {
      if (!positions) return;
      if (mesh && mesh.geometry.attributes.position.count !== positions.length / 3) {
        scene.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
        mesh = null;
      }
      if (!mesh) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions.length), 3));
        geometry.setIndex(indices);
        const material = new THREE.MeshStandardMaterial({ color: 0x00e676, roughness: 0.6 });
        mesh = new THREE.Mesh(geometry, material);
        mesh.frustumCulled = false;
        scene.add(mesh);
      }

      const attribute = mesh.geometry.attributes.position;
      attribute.array.set(positions);
      attribute.needsUpdate = true;
      mesh.geometry.computeVertexNormals();
      mesh.geometry.computeBoundingSphere();
      const { center, radius } = mesh.geometry.boundingSphere;
      mesh.position.copy(center).negate();
      camera.position.z = Math.max(0.25, radius * 3);
      renderer.render(scene, camera);
      preview3d.style.display = 'block';
    }

    async function initMediaPipe() {
      statusEl.textContent = 'در حال بارگذاری مدل...';
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      const createLandmarker = (delegate) => FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
      faceLandmarker = await createLandmarker('GPU').catch(() => createLandmarker('CPU'));
      statusEl.textContent = 'مدل آماده است';
      initThree();
    }

    function resize() {
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        running = true;
        startBtn.style.display = 'none';
        smileBtn.style.display = 'inline-block';
        captureBtn.style.display = 'inline-block';
        stlBtn.style.display = 'inline-block';
        plyBtn.style.display = 'inline-block';
        statusEl.textContent = 'دوربین فعال شد';
        anglesEl.textContent = 'روبه‌روی دوربین و در نور یکنواخت بایست';
        resize();
        window.addEventListener('resize', resize);
        detectLoop();
      } catch (err) {
        statusEl.textContent = 'خطا دوربین: ' + err.message;
      }
    }

    function detectLoop() {
      if (!running || !faceLandmarker) return;

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, overlay.width, overlay.height);

        const cx = overlay.width / 2;
        const cy = overlay.height * 0.42;
        const r = Math.min(overlay.width, overlay.height) * 0.28;
        ctx.strokeStyle = smileMode ? 'rgba(255, 193, 7, 0.7)' : 'rgba(0, 230, 118, 0.6)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        const landmarks = results.faceLandmarks?.[0];
        currentLandmarks = landmarks || null;
        captureBtn.disabled = !landmarks;
        guideEl.textContent = landmarks
          ? (smileMode ? 'لبخند بزن و فریم بگیر' : 'روبه‌رو نگاه کن و فریم بگیر')
          : 'صورت را داخل دایره قرار بده';

        if (landmarks) {
          const scale = Math.max(overlay.width / video.videoWidth, overlay.height / video.videoHeight);
          const imageWidth = video.videoWidth * scale;
          const imageHeight = video.videoHeight * scale;
          const left = (overlay.width - imageWidth) / 2;
          const top = (overlay.height - imageHeight) / 2;

          ctx.fillStyle = smileMode ? '#ffc107' : '#00e676';
          for (const point of landmarks) {
            ctx.beginPath();
            ctx.arc(left + (1 - point.x) * imageWidth, top + point.y * imageHeight, 2, 0, Math.PI * 2);
            ctx.fill();
          }
          if (!capturedPositions) updateMesh(facePositions(landmarks, video.videoWidth / video.videoHeight));
        } else if (!capturedPositions) {
          preview3d.style.display = 'none';
        }
      }
      requestAnimationFrame(detectLoop);
    }

    function sampleVertexColors(landmarks) {
      if (!frameContext) return null;
      frameCanvas.width = video.videoWidth;
      frameCanvas.height = video.videoHeight;
      frameContext.drawImage(video, 0, 0);
      const { width, height } = frameCanvas;
      const pixels = frameContext.getImageData(0, 0, width, height).data;
      const colors = new Uint8Array(FACE_VERTEX_COUNT * 3);
      for (let i = 0; i < FACE_VERTEX_COUNT; i++) {
        const point = landmarks[i];
        const x = Math.max(0, Math.min(width - 1, Math.round(point.x * (width - 1))));
        const y = Math.max(0, Math.min(height - 1, Math.round(point.y * (height - 1))));
        const index = (y * width + x) * 4;
        colors.set(pixels.subarray(index, index + 3), i * 3);
      }
      return colors;
    }

    function subdivisionPlan(indices, vertexCount) {
      const edges = new Map();
      const neighbors = Array.from({ length: vertexCount }, () => new Set());
      const border = Array.from({ length: vertexCount }, () => []);
      const triangles = [];
      function midpoint(a, b, opposite) {
        const key = Math.min(a, b) * vertexCount + Math.max(a, b);
        let edge = edges.get(key);
        if (!edge) {
          edge = { a, b, opposites: [], index: vertexCount + edges.size };
          edges.set(key, edge);
          neighbors[a].add(b);
          neighbors[b].add(a);
        }
        edge.opposites.push(opposite);
        return edge.index;
      }

      for (let i = 0; i < indices.length; i += 3) {
        const [a, b, c] = [indices[i], indices[i + 1], indices[i + 2]];
        const ab = midpoint(a, b, c);
        const bc = midpoint(b, c, a);
        const ca = midpoint(c, a, b);
        triangles.push(a, ab, ca, ab, b, bc, ca, bc, c, ab, bc, ca);
      }
      for (const { a, b, opposites } of edges.values()) {
        if (opposites.length === 1) {
          border[a].push(b);
          border[b].push(a);
        }
      }
      return { edges, neighbors, border, indices: triangles, vertexCount: vertexCount + edges.size };
    }

    const firstSubdivision = subdivisionPlan(FACE_INDICES, FACE_VERTEX_COUNT);
    const secondSubdivision = subdivisionPlan(firstSubdivision.indices, firstSubdivision.vertexCount);

    function subdivide(positions, colors, plan) {
      const refined = new Float32Array(plan.vertexCount * 3);
      const rgb = colors ? new Uint8Array(refined.length) : null;
      for (let v = 0; v < positions.length / 3; v++) {
        const rim = plan.border[v];
        const ring = plan.neighbors[v];
        const beta = (5 / 8 - (3 / 8 + Math.cos(2 * Math.PI / ring.size) / 4) ** 2) / ring.size;
        for (let axis = 0; axis < 3; axis++) {
          const index = 3 * v + axis;
          const current = positions[index];
          let offset = 0;
          if (rim.length === 2) {
            offset = (positions[3 * rim[0] + axis] + positions[3 * rim[1] + axis] - 2 * current) / 8;
          } else if (!rim.length) {
            for (const neighbor of ring) offset += beta * (positions[3 * neighbor + axis] - current);
          }
          refined[index] = current + 0.65 * offset;
          if (rgb) rgb[index] = colors[index];
        }
      }
      for (const { a, b, opposites, index } of plan.edges.values()) {
        for (let axis = 0; axis < 3; axis++) {
          const start = 3 * a + axis;
          const end = 3 * b + axis;
          const middle = 3 * index + axis;
          const average = (positions[start] + positions[end]) / 2;
          refined[middle] = opposites.length === 2
            ? 0.75 * average + 0.125 * (positions[3 * opposites[0] + axis] + positions[3 * opposites[1] + axis])
            : average;
          if (rgb) rgb[middle] = Math.round((colors[start] + colors[end]) / 2);
        }
      }
      return { positions: refined, colors: rgb };
    }

    function vertexNormals(positions, indices) {
      const normals = new Float32Array(positions.length);
      for (let i = 0; i < indices.length; i += 3) {
        const a = indices[i] * 3, b = indices[i + 1] * 3, c = indices[i + 2] * 3;
        const ux = positions[b] - positions[a], uy = positions[b + 1] - positions[a + 1], uz = positions[b + 2] - positions[a + 2];
        const vx = positions[c] - positions[a], vy = positions[c + 1] - positions[a + 1], vz = positions[c + 2] - positions[a + 2];
        for (const vertex of [a, b, c]) {
          normals[vertex] += uy * vz - uz * vy;
          normals[vertex + 1] += uz * vx - ux * vz;
          normals[vertex + 2] += ux * vy - uy * vx;
        }
      }
      for (let i = 0; i < normals.length; i += 3) {
        const length = Math.hypot(normals[i], normals[i + 1], normals[i + 2]);
        if (!length) continue;
        normals[i] /= length;
        normals[i + 1] /= length;
        normals[i + 2] /= length;
      }
      return normals;
    }

    function captureFrame() {
      const positions = facePositions(currentLandmarks, video.videoWidth / video.videoHeight);
      if (!positions) {
        statusEl.textContent = 'صورت را دوباره در کادر قرار بده';
        return;
      }
      try {
        capturedColors = sampleVertexColors(currentLandmarks);
      } catch (error) {
        capturedColors = null;
      }
      const first = subdivide(positions, capturedColors, firstSubdivision);
      const refined = subdivide(first.positions, first.colors, secondSubdivision);
      capturedPositions = refined.positions;
      capturedColors = refined.colors;
      capturedIndices = secondSubdivision.indices;
      updateMesh(capturedPositions, capturedIndices);
      captureBtn.textContent = 'گرفتن دوباره';
      stlBtn.disabled = false;
      plyBtn.disabled = !capturedColors;
      statusEl.textContent = capturedColors
        ? 'فریم ثبت شد. خروجی STL و PLY رنگی آماده است.'
        : 'فریم ثبت شد. خروجی STL آماده است.';
    }

    function faceSTL(positions, indices = FACE_INDICES) {
      const output = ['solid face_surface'];
      const coordinateScale = 100;
      for (let i = 0; i < indices.length; i += 3) {
        const a = indices[i] * 3;
        const b = indices[i + 1] * 3;
        const c = indices[i + 2] * 3;
        const ux = positions[b] - positions[a];
        const uy = positions[b + 1] - positions[a + 1];
        const uz = positions[b + 2] - positions[a + 2];
        const vx = positions[c] - positions[a];
        const vy = positions[c + 1] - positions[a + 1];
        const vz = positions[c + 2] - positions[a + 2];
        const nx = uy * vz - uz * vy;
        const ny = uz * vx - ux * vz;
        const nz = ux * vy - uy * vx;
        const length = Math.hypot(nx, ny, nz);
        if (length < 1e-10) return null;

        output.push(`  facet normal ${nx / length} ${ny / length} ${nz / length}`, '    outer loop');
        for (const offset of [a, b, c]) {
          const [x, y, z] = positions.subarray(offset, offset + 3);
          output.push(`      vertex ${x * coordinateScale} ${y * coordinateScale} ${z * coordinateScale}`);
        }
        output.push('    endloop', '  endfacet');
      }
      output.push('endsolid face_surface', '');
      return output.join('\n');
    }

    function exportSTL() {
      if (!capturedPositions) return;
      const stl = faceSTL(capturedPositions, capturedIndices);
      if (!stl) {
        statusEl.textContent = 'سطح این فریم ناقص است. روبه‌روی دوربین دوباره فریم بگیر.';
        return;
      }

      downloadModel(stl, 'face-surface.stl', 'model/stl');
      statusEl.textContent = 'STL سطح صورت آماده شد. ابعاد فایل تقریبی است.';
    }

    function facePLY(positions, colors, indices) {
      const normals = vertexNormals(positions, indices);
      const lines = [
        'ply', 'format ascii 1.0', 'comment Approximate facial surface',
        `element vertex ${positions.length / 3}`,
        'property float x', 'property float y', 'property float z',
        'property float nx', 'property float ny', 'property float nz',
        'property uchar red', 'property uchar green', 'property uchar blue',
        `element face ${indices.length / 3}`,
        'property list uchar int vertex_indices', 'end_header'
      ];
      for (let i = 0; i < positions.length; i += 3) {
        const [x, y, z] = positions.subarray(i, i + 3);
        const [nx, ny, nz] = normals.subarray(i, i + 3);
        const [red, green, blue] = colors.subarray(i, i + 3);
        lines.push(`${100 * x} ${100 * y} ${100 * z} ${nx} ${ny} ${nz} ${red} ${green} ${blue}`);
      }
      for (let i = 0; i < indices.length; i += 3) {
        lines.push(`3 ${indices[i]} ${indices[i + 1]} ${indices[i + 2]}`);
      }
      return lines.join('\n') + '\n';
    }

    function exportPLY() {
      if (!capturedPositions || !capturedColors) return;
      downloadModel(facePLY(capturedPositions, capturedColors, capturedIndices), 'face-surface-color.ply', 'application/octet-stream');
      statusEl.textContent = 'PLY رنگی آماده شد. ابعاد فایل تقریبی است.';
    }

    function downloadModel(contents, name, type) {
      const url = URL.createObjectURL(new Blob([contents], { type }));
      const download = document.createElement('a');
      download.href = url;
      download.download = name;
      document.body.append(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    smileBtn.addEventListener('click', () => {
      smileMode = !smileMode;
      smileBtn.textContent = smileMode ? 'حالت صورت' : 'حالت لبخند';
      smileBtn.style.background = smileMode ? '#ff9800' : '#424242';
      capturedPositions = null;
      capturedColors = null;
      capturedIndices = null;
      plyBtn.disabled = true;
      captureBtn.textContent = 'گرفتن فریم';
      stlBtn.disabled = true;
      preview3d.style.display = 'none';
      statusEl.textContent = smileMode ? 'حالت ثبت لبخند' : 'حالت ثبت صورت';
    });

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      try {
        if (!faceLandmarker) await initMediaPipe();
        await startCamera();
      } catch (error) {
        statusEl.textContent = 'خطا در راه‌اندازی اسکن: ' + error.message;
      } finally {
        startBtn.disabled = false;
      }
    });

    captureBtn.addEventListener('click', captureFrame);
    stlBtn.addEventListener('click', exportSTL);
    plyBtn.addEventListener('click', exportPLY);
  </script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Face Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f0f0f; 
      color: white; 
      overflow: hidden;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror */
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #ui {
      position: absolute;
      bottom: 30px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
    }
    button {
      background: #2196F3;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(33,150,243,0.4);
    }
    button:active { transform: scale(0.96); }
    #status {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.8;
    }
    #canvas3d {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
  <canvas id="canvas3d"></canvas>

  <div id="ui">
    <button id="startBtn">شروع اسکن صورت</button>
    <div id="status">آماده برای شروع</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');

    let stream = null;
    let scanning = false;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        status.textContent = 'دوربین فعال شد';
        startBtn.textContent = 'در حال اسکن...';
        scanning = true;

        // Resize overlay
        overlay.width = video.videoWidth || window.innerWidth;
        overlay.height = video.videoHeight || window.innerHeight;

        requestAnimationFrame(drawLoop);
      } catch (err) {
        status.textContent = 'خطا در دسترسی به دوربین: ' + err.message;
        console.error(err);
      }
    }

    function drawLoop() {
      if (!scanning) return;

      ctx.clearRect(0, 0, overlay.width, overlay.height);

      // Simple face guide circle
      const centerX = overlay.width / 2;
      const centerY = overlay.height / 2;
      const radius = Math.min(overlay.width, overlay.height) * 0.28;

      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(0,255,136,0.15)';
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.font = '18px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('صورت را داخل دایره قرار بده', centerX, centerY + radius + 40);

      requestAnimationFrame(drawLoop);
    }

    startBtn.addEventListener('click', () => {
      if (!scanning) {
        startCamera();
      }
    });

    // Handle resize
    window.addEventListener('resize', () => {
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
    });
  </script>
</body>
</html>

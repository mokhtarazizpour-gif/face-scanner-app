<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Face Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0a0a0a; 
      color: white; 
      overflow: hidden;
      height: 100dvh;
    }
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #ui {
      position: absolute;
      bottom: 30px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      padding: 0 16px;
    }
    button {
      background: #2196F3;
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(33,150,243,0.4);
      margin: 6px;
    }
    button:active { transform: scale(0.96); }
    button.secondary {
      background: #424242;
    }
    #status {
      margin-top: 10px;
      font-size: 15px;
      opacity: 0.9;
      min-height: 22px;
    }
    #guide {
      position: absolute;
      top: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 5;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="guide">صورت را داخل فریم قرار بده</div>

  <div id="ui">
    <button id="startBtn">شروع اسکن</button>
    <button id="captureBtn" class="secondary" style="display:none;">گرفتن عکس</button>
    <div id="status">آماده برای شروع</div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const statusEl = document.getElementById('status');
    const guideEl = document.getElementById('guide');

    let faceLandmarker = null;
    let running = false;
    let lastVideoTime = -1;

    async function initMediaPipe() {
      statusEl.textContent = 'در حال بارگذاری مدل...';
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: false
      });
      statusEl.textContent = 'مدل آماده است';
    }

    function resize() {
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        running = true;
        startBtn.style.display = 'none';
        captureBtn.style.display = 'inline-block';
        statusEl.textContent = 'دوربین فعال شد';
        resize();
        window.addEventListener('resize', resize);
        detectLoop();
      } catch (err) {
        statusEl.textContent = 'خطا دوربین: ' + err.message;
      }
    }

    async function detectLoop() {
      if (!running || !faceLandmarker) return;

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, overlay.width, overlay.height);

        // Guide circle
        const cx = overlay.width / 2;
        const cy = overlay.height * 0.42;
        const r = Math.min(overlay.width, overlay.height) * 0.28;
        ctx.strokeStyle = 'rgba(0, 230, 118, 0.6)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          statusEl.textContent = 'صورت تشخیص داده شد';
          guideEl.textContent = 'صورت خوب است — ثابت نگه دار';

          // Draw landmarks
          ctx.fillStyle = '#00e676';
          for (const lm of landmarks) {
            const x = lm.x * overlay.width;
            const y = lm.y * overlay.height;
            ctx.beginPath();
            ctx.arc(x, y, 2.2, 0, Math.PI * 2);
            ctx.fill();
          }

          // Simple bounding box from landmarks
          let minX = 1, minY = 1, maxX = 0, maxY = 0;
          for (const lm of landmarks) {
            minX = Math.min(minX, lm.x);
            minY = Math.min(minY, lm.y);
            maxX = Math.max(maxX, lm.x);
            maxY = Math.max(maxY, lm.y);
          }
          ctx.strokeStyle = '#2196F3';
          ctx.lineWidth = 3;
          ctx.strokeRect(
            minX * overlay.width,
            minY * overlay.height,
            (maxX - minX) * overlay.width,
            (maxY - minY) * overlay.height
          );
        } else {
          statusEl.textContent = 'صورت پیدا نشد';
          guideEl.textContent = 'صورت را داخل دایره قرار بده';
        }
      }

      requestAnimationFrame(detectLoop);
    }

    function capture() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;
      const tctx = tempCanvas.getContext('2d');
      tctx.translate(tempCanvas.width, 0);
      tctx.scale(-1, 1);
      tctx.drawImage(video, 0, 0);

      const link = document.createElement('a');
      link.download = 'face-scan-' + Date.now() + '.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
      statusEl.textContent = 'عکس ذخیره شد';
    }

    startBtn.addEventListener('click', async () => {
      if (!faceLandmarker) await initMediaPipe();
      startCamera();
    });

    captureBtn.addEventListener('click', capture);

    // Auto init on load
    initMediaPipe().catch(err => {
      statusEl.textContent = 'خطا در بارگذاری: ' + err.message;
    });
  </script>
</body>
</html>

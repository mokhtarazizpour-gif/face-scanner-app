<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Face Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0a0a0a; 
      color: white; 
      overflow: hidden;
      height: 100dvh;
    }
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #preview3d {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 140px;
      height: 140px;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      border: 1px solid #333;
      display: none;
      z-index: 20;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      padding: 0 12px;
    }
    button {
      background: #2196F3;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(33,150,243,0.4);
      margin: 4px;
    }
    button:active { transform: scale(0.96); }
    button.secondary { background: #424242; }
    button.success { background: #4CAF50; }
    #status {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.9;
      min-height: 20px;
    }
    #guide {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 5;
      padding: 0 20px;
    }
    #angles {
      position: absolute;
      top: 50px;
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      opacity: 0.8;
      z-index: 5;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <canvas id="preview3d"></canvas>
  <div id="guide">صورت را داخل فریم قرار بده</div>
  <div id="angles"></div>

  <div id="ui">
    <button id="startBtn">شروع اسکن</button>
    <button id="smileBtn" class="secondary" style="display:none;">حالت لبخند</button>
    <button id="captureBtn" class="secondary" style="display:none;">گرفتن فریم</button>
    <button id="stlBtn" class="success" style="display:none;">خروجی STL</button>
    <div id="status">آماده برای شروع</div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const preview3d = document.getElementById('preview3d');
    const startBtn = document.getElementById('startBtn');
    const smileBtn = document.getElementById('smileBtn');
    const captureBtn = document.getElementById('captureBtn');
    const stlBtn = document.getElementById('stlBtn');
    const statusEl = document.getElementById('status');
    const guideEl = document.getElementById('guide');
    const anglesEl = document.getElementById('angles');

    let faceLandmarker = null;
    let running = false;
    let lastVideoTime = -1;
    let smileMode = false;
    let capturedFrames = [];
    let currentLandmarks = null;

    let scene, camera, renderer, mesh;
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
      camera.position.z = 2;
      renderer = new THREE.WebGLRenderer({ canvas: preview3d, alpha: true, antialias: true });
      renderer.setSize(140, 140);
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(1, 1, 1);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));
    }

    function updateMesh(landmarks) {
      if (!landmarks || landmarks.length < 100) return;
      const points = [];
      for (let i = 0; i < Math.min(landmarks.length, 200); i += 2) {
        const lm = landmarks[i];
        points.push(new THREE.Vector3(
          (lm.x - 0.5) * 2,
          -(lm.y - 0.5) * 2,
          (lm.z || 0) * 2
        ));
      }
      if (points.length < 10) return;

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      if (mesh) scene.remove(mesh);
      mesh = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0x00e676, size: 0.02 }));
      scene.add(mesh);
      renderer.render(scene, camera);
      preview3d.style.display = 'block';
    }

    async function initMediaPipe() {
      statusEl.textContent = 'در حال بارگذاری مدل...';
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
      statusEl.textContent = 'مدل آماده است';
      initThree();
    }

    function resize() {
      overlay.width = window.innerWidth;
      overlay.height = window.innerHeight;
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        running = true;
        startBtn.style.display = 'none';
        smileBtn.style.display = 'inline-block';
        captureBtn.style.display = 'inline-block';
        stlBtn.style.display = 'inline-block';
        statusEl.textContent = 'دوربین فعال شد';
        anglesEl.textContent = 'زوایا: روبه‌رو → چپ → راست → بالا';
        resize();
        window.addEventListener('resize', resize);
        detectLoop();
      } catch (err) {
        statusEl.textContent = 'خطا دوربین: ' + err.message;
      }
    }

    function detectLoop() {
      if (!running || !faceLandmarker) return;

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, overlay.width, overlay.height);

        const cx = overlay.width / 2;
        const cy = overlay.height * 0.42;
        const r = Math.min(overlay.width, overlay.height) * 0.28;
        ctx.strokeStyle = smileMode ? 'rgba(255, 193, 7, 0.7)' : 'rgba(0, 230, 118, 0.6)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          currentLandmarks = landmarks;
          statusEl.textContent = smileMode ? 'لبخند تشخیص داده شد' : 'صورت تشخیص داده شد';
          guideEl.textContent = smileMode ? 'لبخند بزن و ثابت نگه دار' : 'صورت خوب است — ثابت نگه دار';

          ctx.fillStyle = smileMode ? '#ffc107' : '#00e676';
          for (const lm of landmarks) {
            const x = lm.x * overlay.width;
            const y = lm.y * overlay.height;
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
          }

          let minX = 1, minY = 1, maxX = 0, maxY = 0;
          for (const lm of landmarks) {
            minX = Math.min(minX, lm.x);
            minY = Math.min(minY, lm.y);
            maxX = Math.max(maxX, lm.x);
            maxY = Math.max(maxY, lm.y);
          }
          ctx.strokeStyle = '#2196F3';
          ctx.lineWidth = 3;
          ctx.strokeRect(minX * overlay.width, minY * overlay.height, (maxX - minX) * overlay.width, (maxY - minY) * overlay.height);

          updateMesh(landmarks);
        } else {
          statusEl.textContent = 'صورت پیدا نشد';
          guideEl.textContent = 'صورت را داخل دایره قرار بده';
          currentLandmarks = null;
        }
      }
      requestAnimationFrame(detectLoop);
    }

    function captureFrame() {
      if (!currentLandmarks) {
        statusEl.textContent = 'اول صورت را تشخیص بده';
        return;
      }
      capturedFrames.push(currentLandmarks);
      statusEl.textContent = `فریم ${capturedFrames.length} گرفته شد`;
      anglesEl.textContent = `فریم‌های گرفته شده: ${capturedFrames.length}`;
    }

    function exportSTL() {
      if (!currentLandmarks) {
        statusEl.textContent = 'اول صورت را تشخیص بده';
        return;
      }

      // Better mesh: use a grid-like sampling of landmarks for cleaner triangles
      const scale = 120;
      const pts = currentLandmarks.map(lm => ({
        x: (lm.x - 0.5) * scale,
        y: (0.5 - lm.y) * scale,
        z: (lm.z || 0) * scale * 0.6
      }));

      let stl = 'solid face_scan\n';
      // Create triangles in a more structured way (every 4 points form 2 triangles)
      for (let i = 0; i < pts.length - 4; i += 2) {
        const a = pts[i];
        const b = pts[i + 1];
        const c = pts[i + 2];
        const d = pts[i + 3];

        // Triangle 1
        stl += `  facet normal 0 0 1\n    outer loop\n`;
        stl += `      vertex ${a.x.toFixed(3)} ${a.y.toFixed(3)} ${a.z.toFixed(3)}\n`;
        stl += `      vertex ${b.x.toFixed(3)} ${b.y.toFixed(3)} ${b.z.toFixed(3)}\n`;
        stl += `      vertex ${c.x.toFixed(3)} ${c.y.toFixed(3)} ${c.z.toFixed(3)}\n`;
        stl += `    endloop\n  endfacet\n`;

        // Triangle 2
        stl += `  facet normal 0 0 1\n    outer loop\n`;
        stl += `      vertex ${b.x.toFixed(3)} ${b.y.toFixed(3)} ${b.z.toFixed(3)}\n`;
        stl += `      vertex ${d.x.toFixed(3)} ${d.y.toFixed(3)} ${d.z.toFixed(3)}\n`;
        stl += `      vertex ${c.x.toFixed(3)} ${c.y.toFixed(3)} ${c.z.toFixed(3)}\n`;
        stl += `    endloop\n  endfacet\n`;
      }
      stl += 'endsolid face_scan\n';

      const blob = new Blob([stl], { type: 'application/sla' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'face-scan-improved.stl';
      a.click();
      URL.revokeObjectURL(url);
      statusEl.textContent = 'STL بهتر دانلود شد';
    }

    smileBtn.addEventListener('click', () => {
      smileMode = !smileMode;
      smileBtn.textContent = smileMode ? 'حالت صورت' : 'حالت لبخند';
      smileBtn.style.background = smileMode ? '#ff9800' : '#424242';
    });

    startBtn.addEventListener('click', async () => {
      if (!faceLandmarker) await initMediaPipe();
      startCamera();
    });

    captureBtn.addEventListener('click', captureFrame);
    stlBtn.addEventListener('click', exportSTL);

    initMediaPipe().catch(err => {
      statusEl.textContent = 'خطا در بارگذاری: ' + err.message;
    });
  </script>
</body>
</html>
